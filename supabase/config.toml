# Supabase Project Configuration — Edu AI Org / Edu AI
project_id = "edu-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = true
file_size_limit = "100MiB"

[storage.buckets.books]
public = true
file_size_limit = "100MiB"
allowed_mime_types = ["application/pdf", "application/epub+zip"]

[storage.buckets.book-covers]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/svg+xml"]

[storage.buckets.avatars]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/gif"]

[storage.buckets.workspace-files]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["application/pdf", "application/epub+zip", "text/plain", "text/markdown", "application/json", "image/png", "image/jpeg", "image/webp"]

[storage.buckets.chat-attachments]
public = false
file_size_limit = "25MiB"

[storage.buckets.audiobooks]
public = true
file_size_limit = "50MiB"
allowed_mime_types = ["audio/mpeg", "audio/mp3", "audio/wav", "audio/ogg", "image/png", "image/webp"]

[auth]
enabled = true
site_url = "https://ais-pre-vvfmzub4fuhwyulg6tacri-72101744053.europe-west3.run.app"
additional_redirect_urls = [
  "https://ais-dev-vvfmzub4fuhwyulg6tacri-72101744053.europe-west3.run.app",
  "https://ais-dev-vvfmzub4fuhwyulg6tacri-72101744053.europe-west3.run.app/auth/callback",
  "https://ais-dev-vvfmzub4fuhwyulg6tacri-72101744053.europe-west3.run.app/**",
  "https://ais-pre-vvfmzub4fuhwyulg6tacri-72101744053.europe-west3.run.app",
  "https://ais-pre-vvfmzub4fuhwyulg6tacri-72101744053.europe-west3.run.app/auth/callback",
  "https://ais-pre-vvfmzub4fuhwyulg6tacri-72101744053.europe-west3.run.app/**",
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/**",
  "io.supabase.eduai://login-callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[auth.sms]
enable_signup = true
enable_confirmations = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"

[functions.ai-tutor]
verify_jwt = true

[functions.reader-assistant]
verify_jwt = true

[functions.learning-path]
verify_jwt = true

[functions.quiz-generator]
verify_jwt = true
