<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edu AI - Library and Educational Application</title>
    <meta name="description" content="Library and educational application with an AI assistant." />
    <meta property="og:title" content="Edu AI" />
    <meta property="og:description" content="Library and educational application with an AI assistant." />

    <!-- Storage Defense Polyfill for Sandbox iFrames -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
    <script>
      (function() {
        var localMem = {};
        var sessionMem = {};

        function createMockStorage(store) {
          return {
            getItem: function(k) { return store.hasOwnProperty(k) ? store[k] : null; },
            setItem: function(k, v) { store[k] = String(v); },
            removeItem: function(k) { delete store[k]; },
            clear: function() { for (var k in store) delete store[k]; },
            get length() { return Object.keys(store).length; },
            key: function(i) { return Object.keys(store)[i] || null; }
          };
        }

        var mockLocal = createMockStorage(localMem);
        var mockSession = createMockStorage(sessionMem);

        // Safely test whether native localStorage works
        var localWorking = false;
        try {
          var k = '__edu_probe__';
          window.localStorage.setItem(k, '1');
          window.localStorage.removeItem(k);
          localWorking = true;
        } catch (_) {
          localWorking = false;
        }

        if (!localWorking) {
          try {
            Object.defineProperty(window, 'localStorage', {
              value: mockLocal,
              writable: true,
              configurable: true
            });
          } catch (_) {}
          try {
            Object.defineProperty(Window.prototype, 'localStorage', {
              get: function() { return mockLocal; },
              configurable: true
            });
          } catch (_) {}
        }

        var sessionWorking = false;
        try {
          var sk = '__edu_sprobe__';
          window.sessionStorage.setItem(sk, '1');
          window.sessionStorage.removeItem(sk);
          sessionWorking = true;
        } catch (_) {
          sessionWorking = false;
        }

        if (!sessionWorking) {
          try {
            Object.defineProperty(window, 'sessionStorage', {
              value: mockSession,
              writable: true,
              configurable: true
            });
          } catch (_) {}
          try {
            Object.defineProperty(Window.prototype, 'sessionStorage', {
              get: function() { return mockSession; },
              configurable: true
            });
          } catch (_) {}
        }

        // Global uncaught error display banner fallback
        window.addEventListener('error', function(e) {
          var details = (e && e.message) ? e.message : String(e);
          var str = (details + ' ' + (e.filename || '')).toLowerCase();
          if (str.indexOf('websocket') !== -1 || str.indexOf('vite') !== -1 || str.indexOf('hmr') !== -1) {
            e.preventDefault && e.preventDefault();
            return;
          }
          try {
            fetch('/api/client-log', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                type: 'uncaught_error', 
                message: details, 
                filename: e.filename, 
                lineno: e.lineno, 
                colno: e.colno,
                stack: e.error ? e.error.stack : null 
              })
            }).catch(function() {});
          } catch (_) {}
        });

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'Unhandled rejection';
          var str = String(reason).toLowerCase();
          if (str.indexOf('websocket') !== -1 || str.indexOf('vite') !== -1 || str.indexOf('hmr') !== -1) {
            e.preventDefault && e.preventDefault();
            return;
          }
          try {
            fetch('/api/client-log', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: 'unhandled_rejection', reason: reason })
            }).catch(function() {});
          } catch (_) {}
        });
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 font-sans antialiased text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
